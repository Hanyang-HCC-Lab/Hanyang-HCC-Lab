name: Deploy HCC Lab Website

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose dry-run first. Deploy updates the public website.
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - deploy

permissions:
  contents: read
  id-token: write

concurrency:
  group: hcc-website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.mode == 'dry-run' && 'Dry run' || 'Deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build public website
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ap-northeast-2
          role-to-assume: arn:aws:iam::570209248132:role/GitHubActionsHccWebsiteDeploy
          role-session-name: hcc-website-deploy
          allowed-account-ids: "570209248132"
          mask-aws-account-id: true

      - name: Verify assumed AWS identity
        run: aws sts get-caller-identity

      - name: Preview website upload
        if: inputs.mode == 'dry-run'
        run: aws s3 sync frontend/dist s3://hcc.hanyang.ac.kr --dryrun --no-progress

      - name: Upload website build
        if: inputs.mode == 'deploy'
        run: aws s3 sync frontend/dist s3://hcc.hanyang.ac.kr --no-progress

      - name: Invalidate CloudFront cache
        if: inputs.mode == 'deploy'
        run: aws cloudfront create-invalidation --distribution-id E1T8AEW131QA8T --paths "/*" --no-cli-pager
